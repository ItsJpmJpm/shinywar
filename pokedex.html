<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Shiny — Team Snow</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="style.css?v=49">
</head>
<body>
    <header>
        <div class="nav-bar">
            <a href="index.html" class="nav-link">← Asignación</a>
            <span class="nav-title">❄️ Team Snow</span>
            <span class="nav-link disabled">Pokédex Shiny</span>
        </div>
        <h1>Pokédex Shiny Wars 2026</h1>
        <p class="subtitle">Todos los Pokémon Gen 1–5 • Imágenes shiny animadas</p>
    </header>

    <main>
        <div class="pokedex-controls">
            <div class="search-box">
                <input type="text" id="pokedexSearch" placeholder="Buscar Pokémon...">
            </div>
            <div class="pokedex-count" id="pokedexCount"></div>
        </div>
        <div class="pokedex-filters" id="pokedexFilters">
            <button class="filter-btn active" data-tier="all">Todos</button>
            <button class="filter-btn" data-tier="legendary">LEG</button>
            <button class="filter-btn" data-tier="tier0">T0</button>
            <button class="filter-btn" data-tier="tier1">T1</button>
            <button class="filter-btn" data-tier="tier2">T2</button>
            <button class="filter-btn" data-tier="tier3">T3</button>
            <button class="filter-btn" data-tier="tier4">T4</button>
            <button class="filter-btn" data-tier="tier5">T5</button>
            <button class="filter-btn" data-tier="tier6">T6</button>
            <button class="filter-btn" data-tier="tier7">T7</button>
        </div>
        <div class="pokedex-sort">
            <button class="filter-btn active" id="sortNum">por N.º Pokédex</button>
            <button class="filter-btn" id="sortAlpha">A → Z</button>
        </div>
        <div class="pokedex-season-filters">
            <button class="season-btn active" data-season="all">🌿 Todas</button>
            <button class="season-btn" data-season="spring">🌸 Primavera</button>
            <button class="season-btn" data-season="summer">☀️ Verano</button>
            <button class="season-btn" data-season="autumn">🍂 Otoño</button>
            <button class="season-btn" data-season="winter">❄️ Invierno</button>
        </div>
        <div class="pokedex-season-filters">
            <button class="horde-btn active" data-horde="all">Todas las hordas</button>
            <button class="horde-btn" data-horde="5">5×</button>
            <button class="horde-btn" data-horde="3">3×</button>
        </div>
        <div id="pokedexGrid" class="pokedex-pokemon-grid"></div>
    </main>

    <footer>
        <p>Team Snow ❄️ • Shiny Wars 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="pokemon-data.js?v=49"></script>
    <script src="pokemon-routes.js?v=49"></script>
    <script src="pokemon-sprites.js?v=49"></script>
    <script src="supabase-config.js?v=49"></script>
    <script src="auth.js?v=49"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        var grid = document.getElementById("pokedexGrid");
        var countEl = document.getElementById("pokedexCount");
        var searchInput = document.getElementById("pokedexSearch");

        var allPokemon = [];
        for (var key in POKEAPI_IDS) {
            var id = POKEAPI_IDS[key];
            if (id <= 649) {
                allPokemon.push({ name: key, id: id });
            }
        }

        var currentTier = "all";
        var currentSeason = "all";
        var currentHorde = "all";
        var currentSort = "num";

        var session = window.Auth ? Auth.getSession() : null;
        var admin = session && session.role === "admin";

        function showLoginPrompt() {
            var p = document.createElement("div");
            p.className = "login-prompt";
            p.innerHTML = '<a href="index.html" class="nav-link">Inicia sesión</a> para editar estaciones';
            document.querySelector("header").appendChild(p);
        }

        function getAnimatedSprite(id) {
            return "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/shiny/" + id + ".gif";
        }

        function getStaticSprite(id) {
            return "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/" + id + ".png";
        }

        function formatTierBadge(tier) {
            if (!tier) return '<span class="tier-badge">?</span>';
            var cls = tier === "legendary" ? "legendary" : tier === "tier0" ? "tier-0" : tier === "tier1" ? "tier-1" : tier === "tier2" ? "tier-2" : tier === "tier3" ? "tier-3" : tier === "tier4" ? "tier-4" : tier === "tier5" ? "tier-5" : tier === "tier6" ? "tier-6" : tier === "tier7" ? "tier-7" : "";
            var label = tier === "legendary" ? "LEG" : tier === "tier0" ? "T0" : tier === "tier1" ? "T1" : tier === "tier2" ? "T2" : tier === "tier3" ? "T3" : tier === "tier4" ? "T4" : tier === "tier5" ? "T5" : tier === "tier6" ? "T6" : tier === "tier7" ? "T7" : "?";
            return '<span class="tier-badge ' + cls + '">' + label + '</span>';
        }

        function render(query) {
            var q = (query || "").toLowerCase();
            var filtered = [];

            for (var i = 0; i < allPokemon.length; i++) {
                var p = allPokemon[i];
                if (q && p.name.indexOf(q) === -1) continue;
                var liveTier = getPokemonTier(p.name);
                if (currentTier !== "all" && liveTier !== currentTier) continue;
                var liveSeasons = getPokemonSeasons(p.name);
                if (currentSeason !== "all" && liveSeasons.indexOf(currentSeason) === -1) continue;
                if (currentHorde !== "all") {
                    var liveRoutes = getPokemonRoutes(p.name);
                    var targetHorde = parseInt(currentHorde, 10);
                    var hasHorde = false;
                    for (var rs in liveRoutes) {
                        var rlist = liveRoutes[rs];
                        if (!rlist || !rlist.length) continue;
                        for (var ri = 0; ri < rlist.length; ri++) {
                            var rh = typeof rlist[ri] === 'string' ? 5 : (rlist[ri].hordeSize || 5);
                            if (rh === targetHorde) { hasHorde = true; break; }
                        }
                        if (hasHorde) break;
                    }
                    if (!hasHorde) continue;
                }
                filtered.push(p);
            }

            if (currentSort === "alpha") {
                filtered.sort(function(a, b) { return a.name.localeCompare(b.name); });
            } else {
                filtered.sort(function(a, b) { return a.id - b.id; });
            }

            var html = "";
            for (var i = 0; i < filtered.length; i++) {
                var p = filtered[i];
                var animSprite = getAnimatedSprite(p.id);
                var liveTier = getPokemonTier(p.name);
                var editIcon = '<span class="pokedex-edit-icon" data-name="' + p.name + '" title="Editar estaciones">✎</span>';

                html += '<div class="pokedex-card" data-pname="' + p.name + '">';
                html += '<div class="pokedex-sprite-wrap">';
                html += '<img src="' + animSprite + '" class="pokedex-sprite" loading="lazy" onerror="this.src=\'' + getStaticSprite(p.id) + '\'">';
                html += '</div>';
                html += '<div class="pokedex-card-name">' + displayName(p.name) + editIcon + '</div>';
                html += '<div class="pokedex-card-id">#' + p.id + '</div>';
                html += formatTierBadge(liveTier);
                html += getSeasonBadgeHTML(p.name);
                html += getRouteChipsHTML(p.name);
                html += '</div>';
            }

            if (filtered.length === 0) {
                html = '<div class="pokedex-empty">No se encontraron Pokémon.</div>';
            }

            grid.innerHTML = html;
            countEl.textContent = filtered.length + " Pokémon";

            document.querySelectorAll(".pokedex-edit-icon").forEach(function(icon) {
                icon.addEventListener("click", function(e) {
                    e.stopPropagation();
                    openEditModal(icon.dataset.name);
                });
            });

            document.querySelectorAll(".pokedex-sprite, .pokedex-card-name").forEach(function(el) {
                el.addEventListener("click", function(e) {
                    var pname = this.closest(".pokedex-card").dataset.pname;
                    if (pname) showTargetCard(pname);
                });
            });
        }

        var modalEl = null;

        function openEditModal(pokemonName) {
            if (!modalEl) {
                modalEl = document.createElement("div");
                modalEl.className = "season-modal-overlay";
                modalEl.innerHTML =
                    '<div class="season-modal">' +
                        '<h3 class="season-modal-title">Estaciones y Rutas</h3>' +
                        '<p class="season-modal-poke" id="modalPokeName"></p>' +
                        '<div class="modal-section">' +
                            '<label class="modal-label">Estaciones</label>' +
                            '<div class="modal-checkbox-group">' +
                                '<label class="modal-checkbox"><input type="checkbox" value="spring"> 🌸 Primavera</label>' +
                                '<label class="modal-checkbox"><input type="checkbox" value="summer"> ☀️ Verano</label>' +
                                '<label class="modal-checkbox"><input type="checkbox" value="autumn"> 🍂 Otoño</label>' +
                                '<label class="modal-checkbox"><input type="checkbox" value="winter"> ❄️ Invierno</label>' +
                                '<label class="modal-checkbox modal-checkbox-all"><input type="checkbox" value="all" id="modalSeasonAll"> 🌿 Todas</label>' +
                            '</div>' +
                        '</div>' +
                        '<div class="modal-section">' +
                            '<label class="modal-label">Rutas</label>' +
                            '<div id="modalRoutesList" class="picker-routes-list"></div>' +
                            '<div class="picker-add-route-row">' +
                                '<input type="text" id="modalRouteInput" class="picker-route-input" placeholder="Escribí una ruta..." autocomplete="off">' +
                                '<select id="modalRouteSeasonSelect" class="picker-route-season-select">' +
                                    '<option value="all">🌿 Todas</option>' +
                                    '<option value="spring">🌸 Primavera</option>' +
                                    '<option value="summer">☀️ Verano</option>' +
                                    '<option value="autumn">🍂 Otoño</option>' +
                                    '<option value="winter">❄️ Invierno</option>' +
                                '</select>' +
                                '<select id="modalRouteTimeSelect" class="picker-route-season-select" style="width:auto">' +
                                    '<option value="all">🔄 Todas</option>' +
                                    '<option value="morning">🌅 Mañana</option>' +
                                    '<option value="day">☀️ Día</option>' +
                                    '<option value="night">🌙 Noche</option>' +
                                '</select>' +
                                '<select id="modalRouteChanceSelect" class="picker-route-season-select" style="width:auto">' +
                                    '<option value="100">100%</option>' +
                                    '<option value="75">75%</option>' +
                                    '<option value="50">50%</option>' +
                                    '<option value="25">25%</option>' +
                                '</select>' +
                                '<select id="modalRouteHordeSelect" class="picker-route-season-select" style="width:auto;min-width:4rem">' +
                                    '<option value="5">5×</option>' +
                                    '<option value="3">3×</option>' +
                                '</select>' +
                                '<button id="modalAddRouteBtn" class="picker-add-route-btn">+</button>' +
                            '</div>' +
                            '<div class="route-autocomplete hidden" id="modalRouteAutocomplete"></div>' +
                        '</div>' +
                        '<div class="season-modal-actions">' +
                            '<button id="modalSaveBtn" class="btn btn-primary">Guardar</button>' +
                            '<button id="modalCancelBtn" class="btn btn-cancel">Cancelar</button>' +
                        '</div>' +
                    '</div>';
                document.body.appendChild(modalEl);

                modalEl.addEventListener("click", function(e) {
                    if (e.target === modalEl) closeEditModal();
                });
                document.getElementById("modalCancelBtn").addEventListener("click", closeEditModal);

                var allCheck = document.getElementById("modalSeasonAll");
                allCheck.addEventListener("change", function() {
                    if (allCheck.checked) {
                        document.querySelectorAll(".modal-checkbox-group input[type=checkbox]:not(#modalSeasonAll)").forEach(function(cb) {
                            cb.checked = false;
                        });
                    }
                });

                document.querySelectorAll(".modal-checkbox-group input[type=checkbox]:not(#modalSeasonAll)").forEach(function(cb) {
                    cb.addEventListener("change", function() {
                        if (allCheck.checked) {
                            allCheck.checked = false;
                        }
                        var anyChecked = false;
                        document.querySelectorAll(".modal-checkbox-group input[type=checkbox]:not(#modalSeasonAll)").forEach(function(c) {
                            if (c.checked) anyChecked = true;
                        });
                        if (!anyChecked) allCheck.checked = true;
                    });
                });

                // Route autocomplete
                var modalRouteInput = document.getElementById("modalRouteInput");
                var modalRouteAC = document.getElementById("modalRouteAutocomplete");

                function showModalRouteAC(query) {
                    if (!query || query.length < 1) { modalRouteAC.classList.add('hidden'); return; }
                    var results = suggestRoutes(query);
                    if (!results.length) { modalRouteAC.classList.add('hidden'); return; }
                    modalRouteAC.innerHTML = results.map(function(r) {
                        return '<div class="route-ac-item" data-route="' + esc(r) + '">' + esc(r) + '</div>';
                    }).join('');
                    modalRouteAC.classList.remove('hidden');
                    modalRouteAC.querySelectorAll('.route-ac-item').forEach(function(item) {
                        item.addEventListener('click', function() {
                            modalRouteInput.value = this.dataset.route;
                            modalRouteAC.classList.add('hidden');
                        });
                    });
                }

                modalRouteInput.addEventListener('input', function() { showModalRouteAC(this.value); });
                modalRouteInput.addEventListener('blur', function() { setTimeout(function() { modalRouteAC.classList.add('hidden'); }, 200); });
                modalRouteInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        document.getElementById('modalAddRouteBtn').click();
                    } else if (e.key === 'Escape') {
                        modalRouteAC.classList.add('hidden');
                    }
                });

                var timeIcons = {all:"🔄", day:"☀️", night:"🌙", morning:"🌅"};

                // Click chip to edit, click ✕ to remove
                document.getElementById('modalRoutesList').addEventListener('click', function(e) {
                    var chip = e.target.closest('.picker-route-chip');
                    if (!chip) return;
                    if (e.target.classList.contains('picker-route-remove')) {
                        chip.remove();
                        return;
                    }
                    modalRouteInput.value = chip.querySelector('.picker-route-remove').dataset.route;
                    document.getElementById('modalRouteSeasonSelect').value = chip.dataset.season;
                    document.getElementById('modalRouteTimeSelect').value = chip.dataset.time || 'all';
                    document.getElementById('modalRouteChanceSelect').value = chip.dataset.chance || '100';
                    document.getElementById('modalRouteHordeSelect').value = chip.dataset.horde || '5';
                    chip.remove();
                    modalRouteInput.focus();
                });

                document.getElementById("modalAddRouteBtn").addEventListener("click", function() {
                    var route = modalRouteInput.value.trim();
                    if (!route) return;
                    var s = document.getElementById('modalRouteSeasonSelect').value;
                    var time = document.getElementById('modalRouteTimeSelect').value;
                    var chance = parseInt(document.getElementById('modalRouteChanceSelect').value, 10);
                    var hordeSize = parseInt(document.getElementById('modalRouteHordeSelect').value, 10);
                    var list = document.getElementById('modalRoutesList');
                    var seasonNames = {all:"🌿 Todas", spring:"🌸 Primavera", summer:"☀️ Verano", autumn:"🍂 Otoño", winter:"❄️ Invierno"};
                    var chip = document.createElement('div');
                    chip.className = 'picker-route-chip';
                    chip.dataset.season = s;
                    chip.dataset.time = time;
                    chip.dataset.chance = chance;
                    chip.dataset.horde = hordeSize;
                    chip.innerHTML = '<span class="picker-route-season">' + (seasonNames[s]||s) + '</span> ' + (timeIcons[time]||"") + ' <strong>' + hordeSize + '×</strong> ' + esc(route) + ' <span class="picker-route-chance">' + chance + '%</span> <button class="picker-route-remove" data-route="' + esc(route) + '">✕</button>';
                    list.appendChild(chip);
                    modalRouteInput.value = '';
                    modalRouteAC.classList.add('hidden');
                    modalRouteInput.focus();
                });

                document.getElementById("modalSaveBtn").addEventListener("click", function() {
                    var name = modalEl.dataset.pname;

                    var allCheck = document.getElementById("modalSeasonAll");
                    var seasonsStr;
                    if (allCheck.checked) {
                        seasonsStr = "all";
                    } else {
                        var selected = [];
                        document.querySelectorAll(".modal-checkbox-group input[type=checkbox]:not(#modalSeasonAll)").forEach(function(cb) {
                            if (cb.checked) selected.push(cb.value);
                        });
                        seasonsStr = selected.length > 0 ? selected.join(",") : "all";
                    }

                    var routes = {};
                    document.querySelectorAll('#modalRoutesList .picker-route-chip').forEach(function(chip) {
                        var s = chip.dataset.season;
                        var route = chip.querySelector('.picker-route-remove').dataset.route;
                        var time = chip.dataset.time || 'all';
                        var chance = parseInt(chip.dataset.chance, 10) || 100;
                        var hordeSize = parseInt(chip.dataset.horde, 10) || 5;
                        if (!routes[s]) routes[s] = [];
                        routes[s].push({ route: route, time: time, chance: chance, hordeSize: hordeSize });
                    });

                    savePokemonData(name, seasonsStr, routes);
                });
            }

            modalEl.dataset.pname = pokemonName;
            document.getElementById("modalPokeName").textContent = displayName(pokemonName) + " (#" + getPokemonId(pokemonName) + ")";

            // Load seasons
            var seasons = getPokemonSeasons(pokemonName);
            var allCheck = document.getElementById("modalSeasonAll");
            if (seasons.length === 1 && seasons[0] === "all") {
                allCheck.checked = true;
                document.querySelectorAll(".modal-checkbox-group input[type=checkbox]:not(#modalSeasonAll)").forEach(function(cb) {
                    cb.checked = false;
                });
            } else {
                allCheck.checked = false;
                document.querySelectorAll(".modal-checkbox-group input[type=checkbox]:not(#modalSeasonAll)").forEach(function(cb) {
                    cb.checked = seasons.indexOf(cb.value) !== -1;
                });
            }

            // Load routes
            var routesList = document.getElementById('modalRoutesList');
            routesList.innerHTML = '';
            var currentRoutes = getPokemonRoutes(pokemonName);
            var seasonNames = {all:"🌿 Todas", spring:"🌸 Primavera", summer:"☀️ Verano", autumn:"🍂 Otoño", winter:"❄️ Invierno"};
            var timeIcons = {all:"🔄", day:"☀️", night:"🌙", morning:"🌅"};
            for (var s in currentRoutes) {
                var list = currentRoutes[s];
                for (var i = 0; i < list.length; i++) {
                    var r = typeof list[i] === 'string' ? { route: list[i], time: 'all', chance: 100, hordeSize: 5 } : list[i];
                    var chip = document.createElement('div');
                    chip.className = 'picker-route-chip';
                    chip.dataset.season = s;
                    chip.dataset.time = r.time || 'all';
                    chip.dataset.chance = r.chance || 100;
                    chip.dataset.horde = r.hordeSize || 5;
                    chip.innerHTML = '<span class="picker-route-season">' + (seasonNames[s]||s) + '</span> ' + (timeIcons[r.time]||"") + ' <strong>' + (r.hordeSize||5) + '×</strong> ' + esc(r.route) + ' <span class="picker-route-chance">' + (r.chance||100) + '%</span> <button class="picker-route-remove" data-route="' + esc(r.route) + '">✕</button>';
                    routesList.appendChild(chip);
                }
            }

            modalEl.style.display = "flex";
        }

        function closeEditModal() {
            if (modalEl) modalEl.style.display = "none";
        }

        function savePokemonData(name, seasons, routes) {
            if (!window.supabaseClient) {
                alert("No hay conexión con la base de datos.");
                document.getElementById("modalSaveBtn").textContent = "Guardar";
                document.getElementById("modalSaveBtn").disabled = false;
                return;
            }
            document.getElementById("modalSaveBtn").textContent = "Guardando...";
            document.getElementById("modalSaveBtn").disabled = true;

            var lcName = name.toLowerCase();
            if (!pokemonOverrides[lcName]) pokemonOverrides[lcName] = {};
            pokemonOverrides[lcName].seasons = seasons || "all";
            if (routes !== undefined) pokemonOverrides[lcName].routes = routes;

            var payload = { name: lcName, seasons: seasons || "all" };
            if (routes !== undefined) payload.routes = routes;

            supabaseClient
                .from("pokemon_data")
                .upsert(payload, { onConflict: "name" })
                .then(function(resp) {
                    document.getElementById("modalSaveBtn").textContent = "Guardar";
                    document.getElementById("modalSaveBtn").disabled = false;
                    if (resp.error) {
                        alert("Error al guardar: " + (resp.error.message || "desconocido"));
                        return;
                    }
                    closeEditModal();
                    render(searchInput.value);
                })
                .catch(function(err) {
                    document.getElementById("modalSaveBtn").textContent = "Guardar";
                    document.getElementById("modalSaveBtn").disabled = false;
                    alert("Error: " + (err.message || "desconocido"));
                });
        }

        function loadPokemonData() {
            if (!window.supabaseClient) return;
            supabaseClient
                .from("pokemon_data")
                .select("name, seasons, routes")
                .then(function(resp) {
                    if (resp.error) {
                        console.warn("No se pudieron cargar datos:", resp.error);
                        return;
                    }
                    if (resp.data) {
                        for (var i = 0; i < resp.data.length; i++) {
                            var row = resp.data[i];
                            var key = row.name.toLowerCase();
                            if (!pokemonOverrides[key]) pokemonOverrides[key] = {};
                            if (row.seasons) pokemonOverrides[key].seasons = row.seasons;
                            if (row.routes) pokemonOverrides[key].routes = row.routes;
                        }
                    }
                    render(searchInput.value);
                });
        }

        render("");

        if (session) {
            var navRight = document.querySelector(".nav-bar");
            if (navRight) {
                var userBadge = document.createElement("span");
                userBadge.className = "nav-user-badge";
                userBadge.textContent = session.display_name + (admin ? " ⚙️" : "");
                navRight.appendChild(userBadge);

                var logoutLink = document.createElement("a");
                logoutLink.href = "#";
                logoutLink.className = "nav-link nav-logout";
                logoutLink.textContent = "Cerrar sesión";
                logoutLink.addEventListener("click", function(e) {
                    e.preventDefault();
                    Auth.logout();
                    window.location.href = "index.html";
                });
                navRight.appendChild(logoutLink);
            }
        } else {
            showLoginPrompt();
        }

        loadPokemonData();

        searchInput.addEventListener("input", function(e) {
            render(e.target.value);
        });

        document.querySelectorAll("#pokedexFilters .filter-btn").forEach(function(btn) {
            btn.addEventListener("click", function() {
                document.querySelectorAll("#pokedexFilters .filter-btn").forEach(function(b) { b.classList.remove("active"); });
                btn.classList.add("active");
                currentTier = btn.dataset.tier;
                render(searchInput.value);
            });
        });

        document.getElementById("sortNum").addEventListener("click", function() {
            currentSort = "num";
            document.getElementById("sortNum").classList.add("active");
            document.getElementById("sortAlpha").classList.remove("active");
            render(searchInput.value);
        });
        document.getElementById("sortAlpha").addEventListener("click", function() {
            currentSort = "alpha";
            document.getElementById("sortAlpha").classList.add("active");
            document.getElementById("sortNum").classList.remove("active");
            render(searchInput.value);
        });

        document.querySelectorAll(".season-btn").forEach(function(btn) {
            btn.addEventListener("click", function() {
                document.querySelectorAll(".season-btn").forEach(function(b) { b.classList.remove("active"); });
                btn.classList.add("active");
                currentSeason = btn.dataset.season;
                render(searchInput.value);
            });
        });
        document.querySelectorAll(".horde-btn").forEach(function(btn) {
            btn.addEventListener("click", function() {
                document.querySelectorAll(".horde-btn").forEach(function(b) { b.classList.remove("active"); });
                btn.classList.add("active");
                currentHorde = btn.dataset.horde;
                render(searchInput.value);
            });
        });
    });
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        });
      }
    </script>
</body>
</html>

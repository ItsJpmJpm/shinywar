<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Shiny — Team Snow</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="style.css?v=21">
</head>
<body>
    <header>
        <div class="nav-bar">
            <a href="index.html" class="nav-link">← Asignación</a>
            <span class="nav-title">❄️ Team Snow</span>
            <span class="nav-link disabled">Pokédex Shiny</span>
        </div>
        <h1>Pokédex Shiny Wars 2026</h1>
        <p class="subtitle">Todos los Pokémon Gen 1–5 • Imágenes shiny animadas</p>
    </header>

    <main>
        <div class="pokedex-controls">
            <div class="search-box">
                <input type="text" id="pokedexSearch" placeholder="Buscar Pokémon...">
            </div>
            <div class="pokedex-count" id="pokedexCount"></div>
        </div>
        <div class="pokedex-filters" id="pokedexFilters">
            <button class="filter-btn active" data-tier="all">Todos</button>
            <button class="filter-btn" data-tier="legendary">LEG</button>
            <button class="filter-btn" data-tier="tier0">T0</button>
            <button class="filter-btn" data-tier="tier1">T1</button>
            <button class="filter-btn" data-tier="tier2">T2</button>
            <button class="filter-btn" data-tier="tier3">T3</button>
            <button class="filter-btn" data-tier="tier4">T4</button>
            <button class="filter-btn" data-tier="tier5">T5</button>
            <button class="filter-btn" data-tier="tier6">T6</button>
            <button class="filter-btn" data-tier="tier7">T7</button>
        </div>
        <div class="pokedex-sort">
            <button class="filter-btn active" id="sortNum">por N.º Pokédex</button>
            <button class="filter-btn" id="sortAlpha">A → Z</button>
        </div>
        <div class="pokedex-season-filters">
            <button class="season-btn active" data-season="all">🌿 Todas</button>
            <button class="season-btn" data-season="spring">🌸 Primavera</button>
            <button class="season-btn" data-season="summer">☀️ Verano</button>
            <button class="season-btn" data-season="autumn">🍂 Otoño</button>
            <button class="season-btn" data-season="winter">❄️ Invierno</button>
        </div>
        <div id="pokedexGrid" class="pokedex-pokemon-grid"></div>
    </main>

    <footer>
        <p>Team Snow ❄️ • Shiny Wars 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="pokemon-data.js?v=21"></script>
    <script src="pokemon-sprites.js?v=21"></script>
    <script src="supabase-config.js?v=21"></script>
    <script src="auth.js?v=21"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        var grid = document.getElementById("pokedexGrid");
        var countEl = document.getElementById("pokedexCount");
        var searchInput = document.getElementById("pokedexSearch");

        var allPokemon = [];
        for (var key in POKEAPI_IDS) {
            var id = POKEAPI_IDS[key];
            if (id <= 649) {
                allPokemon.push({ name: key, id: id });
            }
        }

        var currentTier = "all";
        var currentSeason = "all";
        var currentSort = "num";

        var session = window.Auth ? Auth.getSession() : null;
        var admin = session && session.role === "admin";

        function showLoginPrompt() {
            var p = document.createElement("div");
            p.className = "login-prompt";
            p.innerHTML = '<a href="index.html" class="nav-link">Iniciar sesión</a> para editar';
            document.querySelector("header").appendChild(p);
        }

        function getAnimatedSprite(id) {
            return "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/shiny/" + id + ".gif";
        }

        function getStaticSprite(id) {
            return "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/" + id + ".png";
        }

        var NAME_MAP = {
            "nidoran-f": "Nidoran♀",
            "nidoran♀": "Nidoran♀",
            "nidoran-m": "Nidoran♂",
            "nidoran♂": "Nidoran♂",
            "farfetchd": "Farfetch'd",
            "farfetch'd": "Farfetch'd",
            "mr. mime": "Mr. Mime",
            "mime jr.": "Mime Jr.",
            "porygon-z": "Porygon-Z",
            "porygon2": "Porygon2",
            "ho-oh": "Ho-Oh"
        };

        function displayName(name) {
            if (NAME_MAP[name]) return NAME_MAP[name];
            return name.charAt(0).toUpperCase() + name.slice(1);
        }

        function formatTierBadge(tier) {
            if (!tier) return '<span class="tier-badge">?</span>';
            var cls = tier === "legendary" ? "legendary" : tier === "tier0" ? "tier-0" : tier === "tier1" ? "tier-1" : tier === "tier2" ? "tier-2" : tier === "tier3" ? "tier-3" : tier === "tier4" ? "tier-4" : tier === "tier5" ? "tier-5" : tier === "tier6" ? "tier-6" : tier === "tier7" ? "tier-7" : "";
            var label = tier === "legendary" ? "LEG" : tier === "tier0" ? "T0" : tier === "tier1" ? "T1" : tier === "tier2" ? "T2" : tier === "tier3" ? "T3" : tier === "tier4" ? "T4" : tier === "tier5" ? "T5" : tier === "tier6" ? "T6" : tier === "tier7" ? "T7" : "?";
            return '<span class="tier-badge ' + cls + '">' + label + '</span>';
        }

        function render(query) {
            var q = (query || "").toLowerCase();
            var filtered = [];

            for (var i = 0; i < allPokemon.length; i++) {
                var p = allPokemon[i];
                if (q && p.name.indexOf(q) === -1) continue;
                var liveTier = getPokemonTier(p.name);
                if (currentTier !== "all" && liveTier !== currentTier) continue;
                var liveSeasons = getPokemonSeasons(p.name);
                if (currentSeason !== "all" && liveSeasons.indexOf(currentSeason) === -1) continue;
                filtered.push(p);
            }

            if (currentSort === "alpha") {
                filtered.sort(function(a, b) { return a.name.localeCompare(b.name); });
            } else {
                filtered.sort(function(a, b) { return a.id - b.id; });
            }

            var html = "";
            for (var i = 0; i < filtered.length; i++) {
                var p = filtered[i];
                var animSprite = getAnimatedSprite(p.id);
                var liveTier = getPokemonTier(p.name);
                var editIcon = admin ? '<span class="pokedex-edit-icon" data-name="' + p.name + '" title="Editar">✎</span>' : "";

                html += '<div class="pokedex-card" data-pname="' + p.name + '">';
                html += '<div class="pokedex-sprite-wrap">';
                html += '<img src="' + animSprite + '" class="pokedex-sprite" loading="lazy" onerror="this.src=\'' + getStaticSprite(p.id) + '\'">';
                html += '</div>';
                html += '<div class="pokedex-card-name">' + displayName(p.name) + editIcon + '</div>';
                html += '<div class="pokedex-card-id">#' + p.id + '</div>';
                html += formatTierBadge(liveTier);
                html += getSeasonBadgeHTML(p.name);
                html += '</div>';
            }

            if (filtered.length === 0) {
                html = '<div class="pokedex-empty">No se encontraron Pokémon.</div>';
            }

            grid.innerHTML = html;
            countEl.textContent = filtered.length + " Pokémon";

            if (admin) {
                document.querySelectorAll(".pokedex-edit-icon").forEach(function(icon) {
                    icon.addEventListener("click", function(e) {
                        e.stopPropagation();
                        openEditModal(icon.dataset.name);
                    });
                });
            }
        }

        var modalEl = null;

        function openEditModal(pokemonName) {
            if (!modalEl) {
                modalEl = document.createElement("div");
                modalEl.className = "season-modal-overlay";
                modalEl.innerHTML =
                    '<div class="season-modal">' +
                        '<h3 class="season-modal-title">Editar Pokémon</h3>' +
                        '<p class="season-modal-poke" id="modalPokeName"></p>' +
                        '<div class="modal-section">' +
                            '<label class="modal-label">Tier</label>' +
                            '<select id="modalTierSelect" class="season-modal-select">' +
                                '<option value="">— Por defecto —</option>' +
                                '<option value="legendary">LEG</option>' +
                                '<option value="tier0">T0</option>' +
                                '<option value="tier1">T1</option>' +
                                '<option value="tier2">T2</option>' +
                                '<option value="tier3">T3</option>' +
                                '<option value="tier4">T4</option>' +
                                '<option value="tier5">T5</option>' +
                                '<option value="tier6">T6</option>' +
                                '<option value="tier7">T7</option>' +
                            '</select>' +
                        '</div>' +
                        '<div class="modal-section">' +
                            '<label class="modal-label">Estaciones</label>' +
                            '<div class="modal-checkbox-group">' +
                                '<label class="modal-checkbox"><input type="checkbox" value="spring"> 🌸 Primavera</label>' +
                                '<label class="modal-checkbox"><input type="checkbox" value="summer"> ☀️ Verano</label>' +
                                '<label class="modal-checkbox"><input type="checkbox" value="autumn"> 🍂 Otoño</label>' +
                                '<label class="modal-checkbox"><input type="checkbox" value="winter"> ❄️ Invierno</label>' +
                                '<label class="modal-checkbox modal-checkbox-all"><input type="checkbox" value="all" id="modalSeasonAll"> 🌿 Todas</label>' +
                            '</div>' +
                        '</div>' +
                        '<div class="season-modal-actions">' +
                            '<button id="modalSaveBtn" class="btn btn-primary">Guardar</button>' +
                            '<button id="modalCancelBtn" class="btn btn-cancel">Cancelar</button>' +
                        '</div>' +
                    '</div>';
                document.body.appendChild(modalEl);

                modalEl.addEventListener("click", function(e) {
                    if (e.target === modalEl) closeEditModal();
                });
                document.getElementById("modalCancelBtn").addEventListener("click", closeEditModal);

                var allCheck = document.getElementById("modalSeasonAll");
                allCheck.addEventListener("change", function() {
                    var checked = allCheck.checked;
                    document.querySelectorAll("#modalSeasonAll").forEach(function(cb) {
                        cb.checked = checked;
                    });
                    document.querySelectorAll(".modal-checkbox-group input[type=checkbox]:not(#modalSeasonAll)").forEach(function(cb) {
                        cb.checked = false;
                        cb.disabled = checked;
                    });
                });

                document.querySelectorAll(".modal-checkbox-group input[type=checkbox]:not(#modalSeasonAll)").forEach(function(cb) {
                    cb.addEventListener("change", function() {
                        if (cb.checked) {
                            allCheck.checked = false;
                        }
                        var anyChecked = false;
                        document.querySelectorAll(".modal-checkbox-group input[type=checkbox]:not(#modalSeasonAll)").forEach(function(c) {
                            if (c.checked) anyChecked = true;
                        });
                        if (!anyChecked) allCheck.checked = true;
                    });
                });

                document.getElementById("modalSaveBtn").addEventListener("click", function() {
                    var name = modalEl.dataset.pname;
                    var tier = document.getElementById("modalTierSelect").value;

                    var allCheck = document.getElementById("modalSeasonAll");
                    if (allCheck.checked) {
                        savePokemonData(name, "all", tier);
                        return;
                    }
                    var selected = [];
                    document.querySelectorAll(".modal-checkbox-group input[type=checkbox]:not(#modalSeasonAll)").forEach(function(cb) {
                        if (cb.checked) selected.push(cb.value);
                    });
                    var seasonsStr = selected.length > 0 ? selected.join(",") : "all";
                    savePokemonData(name, seasonsStr, tier);
                });
            }

            modalEl.dataset.pname = pokemonName;
            document.getElementById("modalPokeName").textContent = displayName(pokemonName) + " (#" + getPokemonId(pokemonName) + ")";

            var curTier = pokemonOverrides[pokemonName] && pokemonOverrides[pokemonName].tier ? pokemonOverrides[pokemonName].tier : "";
            document.getElementById("modalTierSelect").value = curTier;

            var seasons = getPokemonSeasons(pokemonName);
            var allCheck = document.getElementById("modalSeasonAll");
            if (seasons.length === 1 && seasons[0] === "all") {
                allCheck.checked = true;
                document.querySelectorAll(".modal-checkbox-group input[type=checkbox]:not(#modalSeasonAll)").forEach(function(cb) {
                    cb.checked = false;
                    cb.disabled = true;
                });
            } else {
                allCheck.checked = false;
                document.querySelectorAll(".modal-checkbox-group input[type=checkbox]:not(#modalSeasonAll)").forEach(function(cb) {
                    cb.checked = seasons.indexOf(cb.value) !== -1;
                    cb.disabled = false;
                });
            }

            modalEl.style.display = "flex";
        }

        function getPokemonId(name) {
            return POKEAPI_IDS[name] || "?";
        }

        function closeEditModal() {
            if (modalEl) modalEl.style.display = "none";
        }

        function savePokemonData(name, seasons, tier) {
            if (!window.supabaseClient) {
                alert("No hay conexión con la base de datos.");
                document.getElementById("modalSaveBtn").textContent = "Guardar";
                document.getElementById("modalSaveBtn").disabled = false;
                return;
            }
            document.getElementById("modalSaveBtn").textContent = "Guardando...";
            document.getElementById("modalSaveBtn").disabled = true;

            if (!pokemonOverrides[name]) pokemonOverrides[name] = {};
            pokemonOverrides[name].seasons = seasons || "all";
            pokemonOverrides[name].tier = tier || null;

            var payload = { name: name, seasons: seasons || "all" };
            if (tier) payload.tier = tier;
            else payload.tier = null;

            supabaseClient
                .from("pokemon_data")
                .upsert(payload, { onConflict: "name" })
                .then(function(resp) {
                    document.getElementById("modalSaveBtn").textContent = "Guardar";
                    document.getElementById("modalSaveBtn").disabled = false;
                    if (resp.error) {
                        alert("Error al guardar: " + (resp.error.message || "desconocido"));
                        return;
                    }
                    closeEditModal();
                    render(searchInput.value);
                })
                .catch(function(err) {
                    document.getElementById("modalSaveBtn").textContent = "Guardar";
                    document.getElementById("modalSaveBtn").disabled = false;
                    alert("Error: " + (err.message || "desconocido"));
                });
        }

        function loadPokemonData() {
            if (!window.supabaseClient) return;
            supabaseClient
                .from("pokemon_data")
                .select("name, seasons, tier")
                .then(function(resp) {
                    if (resp.error) {
                        console.warn("No se pudieron cargar datos:", resp.error);
                        return;
                    }
                    if (resp.data) {
                        for (var i = 0; i < resp.data.length; i++) {
                            var row = resp.data[i];
                            if (!pokemonOverrides[row.name]) pokemonOverrides[row.name] = {};
                            if (row.seasons) pokemonOverrides[row.name].seasons = row.seasons;
                            if (row.tier) pokemonOverrides[row.name].tier = row.tier;
                        }
                    }
                    render(searchInput.value);
                });
        }

        render("");

        if (session) {
            var navRight = document.querySelector(".nav-bar");
            if (navRight) {
                var userBadge = document.createElement("span");
                userBadge.className = "nav-user-badge";
                userBadge.textContent = session.display_name + (admin ? " ⚙️" : "");
                navRight.appendChild(userBadge);

                var logoutLink = document.createElement("a");
                logoutLink.href = "#";
                logoutLink.className = "nav-link nav-logout";
                logoutLink.textContent = "Cerrar sesión";
                logoutLink.addEventListener("click", function(e) {
                    e.preventDefault();
                    Auth.logout();
                    window.location.href = "index.html";
                });
                navRight.appendChild(logoutLink);
            }
        } else {
            showLoginPrompt();
        }

        loadPokemonData();

        searchInput.addEventListener("input", function(e) {
            render(e.target.value);
        });

        document.querySelectorAll("#pokedexFilters .filter-btn").forEach(function(btn) {
            btn.addEventListener("click", function() {
                document.querySelectorAll("#pokedexFilters .filter-btn").forEach(function(b) { b.classList.remove("active"); });
                btn.classList.add("active");
                currentTier = btn.dataset.tier;
                render(searchInput.value);
            });
        });

        document.getElementById("sortNum").addEventListener("click", function() {
            currentSort = "num";
            document.getElementById("sortNum").classList.add("active");
            document.getElementById("sortAlpha").classList.remove("active");
            render(searchInput.value);
        });
        document.getElementById("sortAlpha").addEventListener("click", function() {
            currentSort = "alpha";
            document.getElementById("sortAlpha").classList.add("active");
            document.getElementById("sortNum").classList.remove("active");
            render(searchInput.value);
        });

        document.querySelectorAll(".season-btn").forEach(function(btn) {
            btn.addEventListener("click", function() {
                document.querySelectorAll(".season-btn").forEach(function(b) { b.classList.remove("active"); });
                btn.classList.add("active");
                currentSeason = btn.dataset.season;
                render(searchInput.value);
            });
        });
    });
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        });
      }
    </script>
</body>
</html>
